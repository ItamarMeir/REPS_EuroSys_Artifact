<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="queueOccupancy" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="65%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="65%" stop-color="#ef4444" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 16px; fill: #f8fafc; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #94a3b8; }
    .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #e2e8f0; font-weight: 600; }
    .sublabel { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #94a3b8; }
    .mono { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 12px; fill: #38bdf8; font-weight: 600; }
    .alert-mono { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 11px; fill: #ef4444; font-weight: 700; }

    @keyframes packetFlow {
      0% { transform: translateX(0); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateX(160px); opacity: 0; }
    }
    .flowing-packet {
      animation: packetFlow 2.4s linear infinite;
    }
  </style>

  <!-- Background -->
  <rect width="860" height="360" rx="12" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />

  <!-- Header -->
  <text x="30" y="36" class="title">The Physical Metaphor: Queue (Buffer) and Pipe (Wire)</text>
  <text x="30" y="56" class="subtitle">How buffering, serialization delay, ECN marking, and propagation delay operate together</text>

  <!-- 1. Incoming Flow (Left) -->
  <g transform="translate(40, 150)">
    <text x="30" y="-30" class="label">Incoming Packets</text>
    <text x="30" y="-12" class="sublabel">from previous hop</text>
    <line x1="0" y1="20" x2="100" y2="20" stroke="#475569" stroke-width="3" stroke-dasharray="4 4" />
    <g class="flowing-packet">
      <rect x="10" y="5" width="30" height="30" rx="4" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5" />
      <text x="25" y="24" class="mono" font-size="10" fill="#fff" text-anchor="middle">PKT</text>
    </g>
  </g>

  <!-- 2. The Queue Buffer (Center) -->
  <g transform="translate(180, 110)">
    <rect width="320" height="110" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <text x="16" y="24" class="label">Switch Queue Buffer (Egress Port)</text>
    
    <!-- Buffer Slots Container -->
    <rect x="16" y="35" width="288" height="45" rx="6" fill="#1e293b" stroke="#334155" />
    
    <!-- Enqueued Packets -->
    <rect x="20" y="39" width="38" height="37" rx="4" fill="#0284c7" stroke="#38bdf8" />
    <text x="39" y="62" class="mono" font-size="10" fill="#fff" text-anchor="middle">#1</text>

    <rect x="62" y="39" width="38" height="37" rx="4" fill="#0284c7" stroke="#38bdf8" />
    <text x="81" y="62" class="mono" font-size="10" fill="#fff" text-anchor="middle">#2</text>

    <rect x="104" y="39" width="38" height="37" rx="4" fill="#0284c7" stroke="#38bdf8" />
    <text x="123" y="62" class="mono" font-size="10" fill="#fff" text-anchor="middle">#3</text>

    <rect x="146" y="39" width="38" height="37" rx="4" fill="#7c3aed" stroke="#c084fc" />
    <text x="165" y="62" class="mono" font-size="10" fill="#fff" text-anchor="middle">#4</text>

    <!-- ECN Marking Boundary -->
    <line x1="195" y1="28" x2="195" y2="88" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="4 2" />
    <text x="195" y="102" class="alert-mono" text-anchor="middle">ecn_thresh (K)</text>

    <!-- Congested Packets (ECN marked) -->
    <rect x="200" y="39" width="38" height="37" rx="4" fill="#991b1b" stroke="#ef4444" />
    <text x="219" y="62" class="mono" font-size="9" fill="#fecaca" text-anchor="middle">ECN</text>

    <rect x="242" y="39" width="38" height="37" rx="4" fill="#991b1b" stroke="#ef4444" />
    <text x="261" y="62" class="mono" font-size="9" fill="#fecaca" text-anchor="middle">ECN</text>
  </g>

  <!-- 3. Serialization / Transmitter (Middle Right) -->
  <g transform="translate(520, 110)">
    <rect width="130" height="110" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" />
    <text x="65" y="24" class="label" text-anchor="middle">Transmitter</text>
    <text x="65" y="44" class="sublabel" text-anchor="middle">Line Rate Draining</text>
    
    <rect x="15" y="55" width="100" height="40" rx="4" fill="#0f172a" stroke="#a855f7" stroke-width="1" />
    <text x="65" y="73" class="mono" font-size="10" text-anchor="middle">drainTime =</text>
    <text x="65" y="87" class="mono" font-size="10" fill="#a855f7" text-anchor="middle">size * 8 / bitrate</text>
  </g>

  <!-- 4. Pipe / Physical Cable (Right) -->
  <g transform="translate(670, 110)">
    <rect width="150" height="110" rx="8" fill="#0f172a" stroke="#22c55e" stroke-width="1.5" />
    <text x="75" y="24" class="label" text-anchor="middle">Pipe (Cable)</text>
    <text x="75" y="44" class="sublabel" text-anchor="middle">Propagation Delay</text>
    
    <rect x="15" y="55" width="120" height="40" rx="4" fill="#1e293b" stroke="#22c55e" stroke-width="1" />
    <text x="75" y="73" class="mono" font-size="10" fill="#22c55e" text-anchor="middle">flight_time =</text>
    <text x="75" y="87" class="mono" font-size="10" fill="#22c55e" text-anchor="middle">length / speed</text>
  </g>

  <!-- Bottom Explanatory Summary -->
  <g transform="translate(40, 270)">
    <rect width="780" height="60" rx="8" fill="#1e293b" stroke="#334155" />
    <text x="20" y="24" class="label" fill="#38bdf8">Key Formula Summary:</text>
    <text x="20" y="45" class="sublabel">
      • <tspan fill="#f8fafc" font-weight="bold">Queuing Delay:</tspan> time waiting in buffer | 
      • <tspan fill="#a855f7" font-weight="bold">Serialization Delay:</tspan> time pushing bits (drainTime) | 
      • <tspan fill="#22c55e" font-weight="bold">Propagation Delay:</tspan> wire transit time (_delay)
    </text>
  </g>
</svg>
