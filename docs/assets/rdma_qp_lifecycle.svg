<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 550" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowRed" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowAmber" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="arrowCyan" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#38bdf8" />
    </marker>
    <marker id="arrowRed" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#ef4444" />
    </marker>
    <marker id="arrowAmber" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#f59e0b" />
    </marker>
    <marker id="arrowGreen" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#22c55e" />
    </marker>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 16px; fill: #f8fafc; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #94a3b8; }
    .col-header { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 13px; }
    .col-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #64748b; }
    .box-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 11px; fill: #cbd5e1; }
    .mono { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 11px; font-weight: 600; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 11px; }
    .card-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; fill: #94a3b8; line-height: 1.35; }
    .wire-label { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 9px; font-weight: 600; text-anchor: middle; }

    /* Animated pulse paths */
    @keyframes animData1 {
      0% { offset-distance: 0%; opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { offset-distance: 100%; opacity: 0; }
    }
    @keyframes animData2 {
      0% { offset-distance: 0%; opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { offset-distance: 100%; opacity: 0; }
    }
    @keyframes animPause {
      0% { offset-distance: 0%; opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { offset-distance: 100%; opacity: 0; }
    }
    @keyframes animCNP {
      0% { offset-distance: 0%; opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { offset-distance: 100%; opacity: 0; }
    }

    .pulse-data-seg1 {
      offset-path: path("M 275 140 L 355 140");
      animation: animData1 1.6s linear infinite;
    }
    .pulse-data-seg2 {
      offset-path: path("M 585 140 L 665 140");
      animation: animData2 1.6s linear infinite 0.8s;
    }
    .pulse-pause-seg {
      offset-path: path("M 355 215 L 275 215");
      animation: animPause 2s ease-in-out infinite 0.5s;
    }
    .pulse-cnp-arc {
      offset-path: path("M 775 355 C 775 405, 160 405, 160 355");
      animation: animCNP 3.5s ease-in-out infinite 0.2s;
    }
  </style>

  <!-- Background -->
  <rect width="940" height="550" rx="14" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />

  <!-- Header -->
  <text x="35" y="34" class="title">RDMA Architecture: Queue Pairs (QPs), Zero-Copy DMA &amp; Congestion Control</text>
  <text x="35" y="52" class="subtitle">Hardware OS-bypass transfer with PFC pause frames (LosslessQueue) and DCQCN rate control</text>


  <!-- ================= 1. SENDER COLUMN (LEFT) ================= -->
  <g transform="translate(35, 75)">
    <rect width="240" height="280" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <text x="16" y="24" class="col-header" fill="#38bdf8">SENDER HOST</text>
    <text x="16" y="38" class="col-sub">Class: RoceSrc / DCQCNSrc</text>

    <!-- User Memory Buffer -->
    <rect x="15" y="48" width="210" height="42" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="25" y="66" class="box-label">App User Buffer (RAM)</text>
    <text x="25" y="80" class="mono" fill="#22c55e" font-size="10">Zero-Copy (No Kernel Buffer)</text>

    <!-- DMA Arrow -->
    <path d="M 120 92 L 120 112" stroke="#22c55e" stroke-width="2" stroke-dasharray="3 2" marker-end="url(#arrowGreen)" />
    <text x="130" y="104" font-size="9" fill="#22c55e" font-weight="bold">Direct DMA</text>

    <!-- RNIC Hardware Container -->
    <rect x="15" y="118" width="210" height="148" rx="6" fill="#1e293b" stroke="#0284c7" stroke-width="1.2" />
    <text x="25" y="136" class="box-label" fill="#38bdf8">RNIC Hardware Context (QP)</text>

    <!-- Send Queue (SQ) & Completion Queue (CQ) -->
    <rect x="25" y="146" width="90" height="44" rx="4" fill="#0f172a" stroke="#38bdf8" />
    <text x="70" y="163" class="mono" fill="#38bdf8" text-anchor="middle">SQ (Send)</text>
    <text x="70" y="179" class="mono" fill="#94a3b8" font-size="9" text-anchor="middle">WQEs</text>

    <rect x="125" y="146" width="90" height="44" rx="4" fill="#0f172a" stroke="#a855f7" />
    <text x="170" y="163" class="mono" fill="#c084fc" text-anchor="middle">CQ (Compl)</text>
    <text x="170" y="179" class="mono" fill="#94a3b8" font-size="9" text-anchor="middle">CQEs</text>

    <!-- Pacing status -->
    <rect x="25" y="198" width="190" height="56" rx="4" fill="#0f172a" stroke="#334155" />
    <text x="35" y="216" class="mono" fill="#e2e8f0" font-size="10">Pacing: _pacing_rate</text>
    <text x="35" y="232" class="mono" fill="#f59e0b" font-size="10">Rate Control: Rc, α</text>
    <text x="35" y="246" class="mono" fill="#94a3b8" font-size="9">State: _state_send</text>
  </g>


  <!-- ================= INTER-NODE LINK: SENDER TO SWITCH ================= -->
  <!-- Wire 1: Data Out -->
  <line x1="275" y1="140" x2="355" y2="140" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowCyan)" />
  <circle cx="0" cy="0" r="5" fill="#38bdf8" filter="url(#glowCyan)" class="pulse-data-seg1" />
  <rect x="282" y="118" width="68" height="18" rx="3" fill="#0f172a" stroke="#0284c7" stroke-width="1" />
  <text x="316" y="130" class="wire-label" fill="#38bdf8">Data →</text>

  <!-- Wire 2: PFC Pause In -->
  <line x1="355" y1="215" x2="275" y2="215" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrowRed)" />
  <circle cx="0" cy="0" r="5" fill="#ef4444" filter="url(#glowRed)" class="pulse-pause-seg" />
  <rect x="282" y="193" width="68" height="18" rx="3" fill="#0f172a" stroke="#ef4444" stroke-width="1" />
  <text x="316" y="205" class="wire-label" fill="#ef4444">← Pause</text>


  <!-- ================= 2. SWITCH COLUMN (CENTER) ================= -->
  <g transform="translate(355, 75)">
    <rect width="230" height="280" rx="10" fill="#0f172a" stroke="#a855f7" stroke-width="1.5" />
    <text x="16" y="24" class="col-header" fill="#c084fc">SWITCH PORT</text>
    <text x="16" y="38" class="col-sub">Class: LosslessQueue</text>

    <!-- Buffer Container -->
    <rect x="15" y="48" width="200" height="130" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="25" y="68" class="box-label">Egress FIFO Buffer</text>

    <!-- Buffer Slots -->
    <g transform="translate(25, 80)">
      <rect x="0" y="0" width="32" height="32" rx="3" fill="#0284c7" />
      <text x="16" y="20" class="mono" fill="#fff" font-size="10" text-anchor="middle">#1</text>

      <rect x="36" y="0" width="32" height="32" rx="3" fill="#0284c7" />
      <text x="52" y="20" class="mono" fill="#fff" font-size="10" text-anchor="middle">#2</text>

      <rect x="72" y="0" width="32" height="32" rx="3" fill="#7c3aed" />
      <text x="88" y="20" class="mono" fill="#fff" font-size="10" text-anchor="middle">#3</text>

      <!-- Watermark line -->
      <line x1="114" y1="-8" x2="114" y2="42" stroke="#ef4444" stroke-width="2" stroke-dasharray="3 2" />

      <rect x="120" y="0" width="32" height="32" rx="3" fill="#991b1b" />
      <text x="136" y="20" class="mono" fill="#fecaca" font-size="9" text-anchor="middle">ECN</text>
    </g>
    <text x="139" y="132" class="mono" fill="#ef4444" font-size="9" text-anchor="middle">_high_threshold</text>
    <text x="25" y="162" class="col-sub">Drain: drainTime = size*8/rate</text>

    <!-- PFC Trigger Box -->
    <rect x="15" y="188" width="200" height="54" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="1.2" />
    <text x="25" y="206" class="card-title" fill="#ef4444">PFC Flow Control Logic</text>
    <text x="25" y="222" class="col-sub">If buffer &gt; _high_threshold:</text>
    <text x="25" y="234" class="mono" fill="#ef4444" font-size="9">send EthPausePacket(1000)</text>

    <!-- Lossless guarantee -->
    <text x="115" y="264" class="mono" fill="#22c55e" font-size="10" text-anchor="middle">✓ Zero Packet Drops (Lossless)</text>
  </g>


  <!-- ================= INTER-NODE LINK: SWITCH TO RECEIVER ================= -->
  <!-- Wire 1: Forwarded Data -->
  <line x1="585" y1="140" x2="665" y2="140" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowCyan)" />
  <circle cx="0" cy="0" r="5" fill="#38bdf8" filter="url(#glowCyan)" class="pulse-data-seg2" />
  <rect x="592" y="118" width="68" height="18" rx="3" fill="#0f172a" stroke="#0284c7" stroke-width="1" />
  <text x="626" y="130" class="wire-label" fill="#38bdf8">Data →</text>

  <!-- Wire 2: ACKs Back -->
  <line x1="665" y1="215" x2="585" y2="215" stroke="#22c55e" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrowGreen)" />
  <rect x="592" y="193" width="68" height="18" rx="3" fill="#0f172a" stroke="#22c55e" stroke-width="1" />
  <text x="626" y="205" class="wire-label" fill="#22c55e">← ACK</text>


  <!-- ================= 3. RECEIVER COLUMN (RIGHT) ================= -->
  <g transform="translate(665, 75)">
    <rect width="240" height="280" rx="10" fill="#0f172a" stroke="#22c55e" stroke-width="1.5" />
    <text x="16" y="24" class="col-header" fill="#22c55e">RECEIVER HOST</text>
    <text x="16" y="38" class="col-sub">Class: RoceSink / DCQCNSink</text>

    <!-- Target Buffer -->
    <rect x="15" y="48" width="210" height="42" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="25" y="66" class="box-label">Target User Buffer (RAM)</text>
    <text x="25" y="80" class="mono" fill="#22c55e" font-size="10">Direct Remote DMA Write</text>

    <!-- DMA Arrow -->
    <path d="M 120 114 L 120 94" stroke="#22c55e" stroke-width="2" stroke-dasharray="3 2" marker-end="url(#arrowGreen)" />
    <text x="130" y="106" font-size="9" fill="#22c55e" font-weight="bold">Direct DMA</text>

    <!-- RNIC Hardware Container -->
    <rect x="15" y="118" width="210" height="148" rx="6" fill="#1e293b" stroke="#16a34a" stroke-width="1.2" />
    <text x="25" y="136" class="box-label" fill="#22c55e">RNIC Receive Context (RQ)</text>

    <!-- Receive Queue & OOO Bitmap -->
    <rect x="25" y="146" width="190" height="44" rx="4" fill="#0f172a" stroke="#22c55e" />
    <text x="35" y="163" class="mono" fill="#22c55e" font-size="10">ACK: _cumulative_ack</text>
    <text x="35" y="179" class="mono" fill="#94a3b8" font-size="9">Bitmap: _epsn_rx_bitmap (OOO)</text>

    <!-- CNP Generation Module -->
    <rect x="25" y="198" width="190" height="56" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2" />
    <text x="35" y="216" class="card-title" fill="#f59e0b">DCQCN CNP Generator</text>
    <text x="35" y="232" class="col-sub">Sends CNP on ECN marked pkts</text>
    <text x="35" y="246" class="mono" fill="#f59e0b" font-size="9">Interval: _cnp_interval</text>
  </g>


  <!-- ================= BOTTOM RETURN ARC: DCQCN CNP ================= -->
  <path d="M 775 355 C 775 405, 160 405, 160 355" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrowAmber)" />
  <circle cx="0" cy="0" r="5" fill="#f59e0b" filter="url(#glowAmber)" class="pulse-cnp-arc" />
  
  <!-- CNP Arc Center Badge (Completely clear of all boxes!) -->
  <g transform="translate(370, 382)">
    <rect width="200" height="22" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2" />
    <text x="100" y="15" class="mono" fill="#f59e0b" text-anchor="middle" font-size="10">← CNPPacket (Cuts Sender Rate) ←</text>
  </g>


  <!-- ================= BOTTOM 3-CARD SUMMARY ================= -->
  <g transform="translate(35, 420)">
    <!-- Card 1: Zero-Copy -->
    <g transform="translate(0, 0)">
      <rect width="275" height="110" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
      <text x="14" y="20" class="card-title" fill="#38bdf8">1. Zero-Copy &amp; OS Bypass</text>
      <text x="14" y="38" class="card-desc">Applications post tasks as WQEs directly to</text>
      <text x="14" y="54" class="card-desc">RNIC hardware without OS system calls.</text>
      <text x="14" y="70" class="card-desc">RNIC performs direct DMA to/from RAM.</text>
      <text x="14" y="88" class="card-desc" fill="#38bdf8">⚡ 0 CPU socket buffer copies.</text>
    </g>

    <!-- Card 2: PFC Flow Control -->
    <g transform="translate(295, 0)">
      <rect width="280" height="110" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.2" />
      <text x="14" y="20" class="card-title" fill="#ef4444">2. Lossless Fabric (PFC Pause)</text>
      <text x="14" y="38" class="card-desc">LosslessQueue sends EthPausePacket to halt</text>
      <text x="14" y="54" class="card-desc">upstream sender before buffer overflows.</text>
      <text x="14" y="70" class="card-desc">Guarantees zero drops, but risks</text>
      <text x="14" y="88" class="card-desc" fill="#ef4444">⚠ PFC Deadlocks &amp; HoL Blocking.</text>
    </g>

    <!-- Card 3: DCQCN Congestion Control -->
    <g transform="translate(595, 0)">
      <rect width="275" height="110" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2" />
      <text x="14" y="20" class="card-title" fill="#f59e0b">3. DCQCN Rate Control</text>
      <text x="14" y="38" class="card-desc">Switches mark ECN before PFC triggers.</text>
      <text x="14" y="54" class="card-desc">DCQCNSink sends CNP packets to cut</text>
      <text x="14" y="70" class="card-desc">transmission rate via α multiplicative factor.</text>
      <text x="14" y="88" class="card-desc" fill="#f59e0b">📉 Prevents buffer buildup proactively.</text>
    </g>
  </g>
</svg>
