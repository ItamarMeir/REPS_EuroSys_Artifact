<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 16px; fill: #f8fafc; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #94a3b8; }
    .slot-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; fill: #64748b; font-weight: 600; text-anchor: middle; }
    .slot-val { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 14px; fill: #38bdf8; font-weight: 700; text-anchor: middle; }
    .branch-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 13px; }
    .branch-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #94a3b8; }

    @keyframes recyclePulse {
      0%, 100% { transform: translateY(0); opacity: 0.8; }
      50% { transform: translateY(-4px); opacity: 1; stroke: #22c55e; }
    }
    @keyframes evictPulse {
      0%, 100% { transform: translateY(0); opacity: 0.8; }
      50% { transform: translateY(4px); opacity: 1; stroke: #ef4444; }
    }
    @keyframes greenFlow {
      0% { offset-distance: 0%; opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { offset-distance: 100%; opacity: 0; }
    }
    @keyframes redFlow {
      0% { offset-distance: 0%; opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { offset-distance: 100%; opacity: 0; }
    }

    .clean-flow {
      offset-path: path("M 160 90 C 260 40, 580 40, 680 90");
      animation: greenFlow 3s ease-in-out infinite;
    }
    .ecn-flow {
      offset-path: path("M 160 270 C 260 330, 580 330, 680 270");
      animation: redFlow 3s ease-in-out infinite 1.5s;
    }
  </style>

  <!-- Background -->
  <rect width="840" height="380" rx="12" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />

  <!-- Header -->
  <text x="30" y="36" class="title">REPS / FREEZING: 8-Slot Entropy Circular Buffer</text>
  <text x="30" y="56" class="subtitle">Dynamic path recycling on clean ACKs vs. fast path eviction on congestion marks</text>

  <!-- 8-Slot Circular Buffer Representation (Center) -->
  <g transform="translate(140, 150)">
    <!-- Outer Container -->
    <rect x="-10" y="-15" width="580" height="80" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    
    <!-- Slots 0 through 7 -->
    <!-- Slot 0 -->
    <g transform="translate(0, 0)">
      <rect width="60" height="50" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
      <text x="30" y="20" class="slot-label">SLOT 0</text>
      <text x="30" y="40" class="slot-val">EV 4</text>
    </g>
    <!-- Slot 1 -->
    <g transform="translate(70, 0)">
      <rect width="60" height="50" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="30" y="20" class="slot-label">SLOT 1</text>
      <text x="30" y="40" class="slot-val">EV 9</text>
    </g>
    <!-- Slot 2 -->
    <g transform="translate(140, 0)">
      <rect width="60" height="50" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="30" y="20" class="slot-label">SLOT 2</text>
      <text x="30" y="40" class="slot-val">EV 2</text>
    </g>
    <!-- Slot 3 -->
    <g transform="translate(210, 0)">
      <rect width="60" height="50" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="30" y="20" class="slot-label">SLOT 3</text>
      <text x="30" y="40" class="slot-val">EV 7</text>
    </g>
    <!-- Slot 4 -->
    <g transform="translate(280, 0)">
      <rect width="60" height="50" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="30" y="20" class="slot-label">SLOT 4</text>
      <text x="30" y="40" class="slot-val">EV 1</text>
    </g>
    <!-- Slot 5 -->
    <g transform="translate(350, 0)">
      <rect width="60" height="50" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="30" y="20" class="slot-label">SLOT 5</text>
      <text x="30" y="40" class="slot-val">EV 5</text>
    </g>
    <!-- Slot 6 -->
    <g transform="translate(420, 0)">
      <rect width="60" height="50" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="30" y="20" class="slot-label">SLOT 6</text>
      <text x="30" y="40" class="slot-val">EV 8</text>
    </g>
    <!-- Slot 7 -->
    <g transform="translate(490, 0)">
      <rect width="60" height="50" rx="6" fill="#1e293b" stroke="#22c55e" stroke-width="1.5" />
      <text x="30" y="20" class="slot-label">SLOT 7</text>
      <text x="30" y="40" class="slot-val" fill="#22c55e">EV 3</text>
    </g>
  </g>

  <!-- Top Arc: Clean ACK (Green) -->
  <path d="M 170 140 C 270 70, 570 70, 670 140" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-dasharray="6 4" />
  <circle cx="0" cy="0" r="7" fill="#22c55e" filter="url(#glowGreen)" class="clean-flow" />

  <!-- Top Action Label -->
  <g transform="translate(320, 75)">
    <rect x="-10" y="-12" width="220" height="28" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="1" />
    <text x="100" y="6" class="branch-title" fill="#22c55e" text-anchor="middle">✓ Clean ACK: Recycle to Tail</text>
  </g>

  <!-- Bottom Arc: ECN Marked (Red) -->
  <path d="M 170 240 C 270 310, 570 310, 670 240" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="6 4" />
  <circle cx="0" cy="0" r="7" fill="#ef4444" filter="url(#glowRed)" class="ecn-flow" />

  <!-- Bottom Action Label -->
  <g transform="translate(310, 285)">
    <rect x="-10" y="-12" width="240" height="28" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1" />
    <text x="110" y="6" class="branch-title" fill="#ef4444" text-anchor="middle">⚠ ECN Marked: Evict &amp; Draw New</text>
  </g>

  <!-- Footer Info -->
  <g transform="translate(130, 335)">
    <text x="290" y="15" text-anchor="middle" class="subtitle">
      <tspan fill="#38bdf8" font-weight="bold">Result:</tspan> Good paths are re-used continuously; congested links are vacated immediately within 1 RTT.
    </text>
  </g>
</svg>
