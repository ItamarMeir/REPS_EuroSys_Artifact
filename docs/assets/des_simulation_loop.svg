<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="leapGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 16px; fill: #f8fafc; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #94a3b8; }
    .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #e2e8f0; font-weight: 500; }
    .time-val { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 13px; fill: #38bdf8; font-weight: 600; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #38bdf8; font-weight: 600; }
    .idle-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #cbd5e1; font-style: italic; }

    @keyframes leapAnimation {
      0% { transform: translateX(0px); opacity: 0; }
      10% { opacity: 1; }
      45% { transform: translateX(340px); opacity: 1; }
      55% { transform: translateX(340px); opacity: 0; }
      100% { transform: translateX(0px); opacity: 0; }
    }

    @keyframes pulseRing {
      0% { r: 8px; opacity: 1; }
      50% { r: 18px; opacity: 0; }
      100% { r: 8px; opacity: 0; }
    }

    @keyframes clockTick {
      0%, 40% { fill: #38bdf8; }
      50%, 90% { fill: #a855f7; }
      100% { fill: #38bdf8; }
    }

    .pulse-tracker {
      animation: leapAnimation 3.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .ring-active {
      animation: pulseRing 1.75s ease-out infinite;
    }
  </style>

  <!-- Background -->
  <rect width="820" height="280" rx="12" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />

  <!-- Card Header -->
  <text x="30" y="38" class="title">Discrete-Event Simulation: The Time Leap Mechanism</text>
  <text x="30" y="58" class="subtitle">Global simulation clock leaps directly between scheduled events without ticking through idle time</text>

  <!-- Timeline Base Axis -->
  <line x1="80" y1="160" x2="740" y2="160" stroke="#475569" stroke-width="3" stroke-linecap="round" />

  <!-- Idle Window Indicator -->
  <rect x="250" y="125" width="340" height="70" rx="8" fill="#1e293b" stroke="#334155" stroke-dasharray="4 4" />
  <text x="420" y="152" text-anchor="middle" class="idle-text">Physical Flight Time (5.0 µs)</text>
  <text x="420" y="172" text-anchor="middle" class="badge-text">⚡ 0 CPU Cycles Wasted on Idle Time</text>

  <!-- Event 1: Packet Transmitted -->
  <g transform="translate(250, 160)">
    <circle cx="0" cy="0" r="16" fill="#0284c7" fill-opacity="0.3" />
    <circle cx="0" cy="0" r="8" fill="#38bdf8" />
    <!-- Ticks & Labels -->
    <line x1="0" y1="-25" x2="0" y2="25" stroke="#38bdf8" stroke-width="2" />
    <rect x="-70" y="-85" width="140" height="50" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1.5" />
    <text x="0" y="-66" text-anchor="middle" class="label">Event 1: Packet Sent</text>
    <text x="0" y="-47" text-anchor="middle" class="time-val">t = 10,000,000 ps</text>
  </g>

  <!-- Arc showing Leap -->
  <path d="M 250 135 Q 420 70 590 135" fill="none" stroke="url(#leapGrad)" stroke-width="3.5" stroke-dasharray="6 6" />

  <!-- Animated Flying Pulse -->
  <g class="pulse-tracker" transform="translate(250, 0)">
    <circle cx="0" cy="160" r="10" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="0" cy="160" r="4" fill="#ffffff" />
  </g>

  <!-- Event 2: Packet Arrives -->
  <g transform="translate(590, 160)">
    <circle cx="0" cy="0" r="16" fill="#7c3aed" fill-opacity="0.3" />
    <circle cx="0" cy="0" r="8" fill="#a855f7" />
    <circle cx="0" cy="0" r="8" fill="none" stroke="#a855f7" stroke-width="2" class="ring-active" />
    <!-- Ticks & Labels -->
    <line x1="0" y1="-25" x2="0" y2="25" stroke="#a855f7" stroke-width="2" />
    <rect x="-75" y="-85" width="150" height="50" rx="6" fill="#0f172a" stroke="#7c3aed" stroke-width="1.5" />
    <text x="0" y="-66" text-anchor="middle" class="label">Event 2: Packet Arrives</text>
    <text x="0" y="-47" text-anchor="middle" class="time-val" fill="#a855f7">t = 15,000,000 ps</text>
  </g>

  <!-- Bottom Description Box -->
  <g transform="translate(80, 225)">
    <rect width="660" height="34" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="330" y="22" text-anchor="middle" class="subtitle">
      <tspan fill="#38bdf8" font-weight="bold">Step 1:</tspan> Queue services pkt → <tspan fill="#38bdf8" font-weight="bold">Step 2:</tspan> Schedule arrival in EventList at now() + 5 µs → <tspan fill="#a855f7" font-weight="bold">Step 3:</tspan> Clock leaps instantly to 15 µs
    </text>
  </g>
</svg>
